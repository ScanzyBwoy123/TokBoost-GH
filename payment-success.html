<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — TokBoost GH</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f7;
      color: #111;
      min-height: 100vh;
    }
    header {
      background: #000;
      color: #fff;
      padding: 18px 20px;
      text-align: center;
      font-size: 21px;
      font-weight: 900;
    }
    header span {
      color: #ff2d55;
    }
    .container {
      max-width: 650px;
      margin: auto;
      padding: 35px 18px 60px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }
    .center {
      text-align: center;
    }
    .icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e8fff1;
      color: #159447;
      font-size: 38px;
      font-weight: 900;
    }
    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .status {
      background: #fff8df;
      border: 1px solid #f1df9e;
      border-radius: 16px;
      padding: 18px;
      margin: 25px 0;
      text-align: left;
    }
    .status-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 6px;
    }
    .status-text {
      color: #6f5b00;
      font-size: 14px;
      line-height: 1.5;
    }
    .details {
      margin-top: 20px;
      border-top: 1px solid #eee;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }
    .label {
      color: #777;
      font-size: 13px;
    }
    .value {
      font-weight: 800;
      text-align: right;
      max-width: 60%;
      word-break: break-word;
    }
    .progress {
      margin-top: 28px;
    }
    .progress-title {
      font-weight: 900;
      margin-bottom: 18px;
    }
    .step {
      display: flex;
      gap: 13px;
      margin-bottom: 18px;
      text-align: left;
    }
    .circle {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #eee;
      color: #777;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
    }
    .circle.done {
      background: #159447;
      color: #fff;
    }
    .circle.active {
      background: #111;
      color: #fff;
    }
    .step strong {
      display: block;
      margin-bottom: 4px;
    }
    .step small {
      color: #777;
      line-height: 1.4;
    }
    .button {
      display: block;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #111;
      color: #fff;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      margin-top: 25px;
    }
    .button:hover {
      background: #333;
    }
    .secondary {
      background: #f1f1f3;
      color: #111;
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 25px;
    }
    .error {
      background: #fff0f0;
      border: 1px solid #f2b8b8;
      color: #9b1c1c;
      border-radius: 14px;
      padding: 18px;
      line-height: 1.5;
      text-align: left;
    }
    .support {
      margin-top: 25px;
      padding: 17px;
      border-radius: 15px;
      background: #f7f7f8;
      color: #555;
      font-size: 13px;
      line-height: 1.6;
    }
    @media (max-width: 500px) {
      .card {
        padding: 25px 17px;
      }
      h1 {
        font-size: 27px;
      }
      .row {
        flex-direction: column;
        gap: 5px;
      }
      .value {
        max-width: 100%;
        text-align: left;
      }
    }
  </style>
</head>
<body>
<header>
  Tok<span>Boost</span> GH
</header>
<main class="container">
  <div class="card" id="app">
    <div class="loading">
      Verifying your payment and loading your order...
    </div>
  </div>
</main>
<script>
  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  function getReference() {
    const params =
      new URLSearchParams(
        window.location.search
      );
    return (
      params.get("reference") ||
      params.get("trxref") ||
      localStorage.getItem(
        "tokboost_payment_reference"
      ) ||
      ""
    );
  }
  async function verifyPayment() {
    const app =
      document.getElementById("app");
    const reference =
      getReference();
    if (!reference) {
      app.innerHTML = `
        <div class="center">
          <div class="icon">!</div>
          <h1>Payment Received</h1>
          <p class="subtitle">
            We could not find your payment reference.
          </p>
        </div>
        <div class="error">
          Please do not make another payment.
          <br><br>
          If money was deducted from your account,
          contact TokBoost GH support with your
          Paystack payment receipt.
        </div>
        <a
          class="button"
          href="/"
        >
          Back to TokBoost GH
        </a>
      `;
      return;
    }
    try {
      // --------------------------------------------------------
      // VERIFY PAYMENT
      // --------------------------------------------------------
      const verifyResponse =
        await fetch(
          "/.netlify/functions/verify-payment",
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              reference: reference
            })
          }
        );
      const verification =
        await verifyResponse.json();
      if (
        !verifyResponse.ok ||
        !verification.status ||
        !verification.paid
      ) {
        throw new Error(
          verification.error ||
          "Payment could not be verified."
        );
      }
      const finalReference =
        verification.reference ||
        reference;
      localStorage.setItem(
        "tokboost_payment_reference",
        finalReference
      );
      // --------------------------------------------------------
      // GET SAVED ORDER FROM SUPABASE
      // --------------------------------------------------------
      const orderResponse =
        await fetch(
          `/.netlify/functions/get-order?reference=${encodeURIComponent(finalReference)}`
        );
      const orderData =
        await orderResponse.json();
      if (
        !orderResponse.ok ||
        !orderData.status ||
        !orderData.order
      ) {
        throw new Error(
          orderData.error ||
          "Your payment was verified, but your order is still being prepared."
        );
      }
      const order =
        orderData.order;
      // --------------------------------------------------------
      // DISPLAY ORDER
      // --------------------------------------------------------
      app.innerHTML = `
        <div class="center">
          <div class="icon">✓</div>
          <h1>
            Payment Successful!
          </h1>
          <p class="subtitle">
            Your payment has been successfully
            verified and your order has been received.
          </p>
        </div>
        <div class="status">
          <div class="status-title">
            🟡 Order Processing
          </div>
          <div class="status-text">
            Your order is now being processed.
            You do not need to make another payment.
          </div>
        </div>
        <div class="details">
          <div class="row">
            <div class="label">
              Package
            </div>
            <div class="value">
              ${escapeHTML(
                order.packageName
              )}
            </div>
          </div>
          <div class="row">
            <div class="label">
              Amount
            </div>
            <div class="value">
              GH₵${escapeHTML(
                Number(order.amount || 0)
                  .toFixed(2)
              )}
            </div>
          </div>
          <div class="row">
            <div class="label">
              Payment Reference
            </div>
            <div class="value">
              ${escapeHTML(
                order.reference
              )}
            </div>
          </div>
          ${
            order.customerName
              ? `
                <div class="row">
                  <div class="label">
                    Customer
                  </div>
                  <div class="value">
                    ${escapeHTML(
                      order.customerName
                    )}
                  </div>
                </div>
              `
              : ""
          }
          ${
            order.tiktokTarget
              ? `
                <div class="row">
                  <div class="label">
                    TikTok Target
                  </div>
                  <div class="value">
                    ${escapeHTML(
                      order.tiktokTarget
                    )}
                  </div>
                </div>
              `
              : ""
          }
          <div class="row">
            <div class="label">
              Order Status
            </div>
            <div class="value">
              ${escapeHTML(
                order.status ||
                "processing"
              )}
            </div>
          </div>
        </div>
        <div class="progress">
          <div class="progress-title">
            Order Progress
          </div>
          <div class="step">
            <div class="circle done">
              ✓
            </div>
            <div>
              <strong>
                Payment Received
              </strong>
              <small>
                Your payment has been successfully verified.
              </small>
            </div>
          </div>
          <div class="step">
            <div class="circle active">
              2
            </div>
            <div>
              <strong>
                Order Processing
              </strong>
              <small>
                Your TokBoost order is being prepared.
              </small>
            </div>
          </div>
          <div class="step">
            <div class="circle">
              3
            </div>
            <div>
              <strong>
                Promotion In Progress
              </strong>
              <small>
                This stage will update when fulfillment begins.
              </small>
            </div>
          </div>
          <div class="step">
            <div class="circle">
              4
            </div>
            <div>
              <strong>
                Completed
              </strong>
              <small>
                Your order will be marked completed after fulfillment.
              </small>
            </div>
          </div>
        </div>
        <a
          class="button"
          href="/track-order.html?reference=${encodeURIComponent(
            order.reference
          )}"
        >
          Track My Order
        </a>
        <a
          class="button secondary"
          href="/"
        >
          Back to TokBoost GH
        </a>
        <div class="support">
          Need help?
          Contact TokBoost GH support and include
          your payment reference.
        </div>
      `;
    } catch (error) {
      console.error(
        "Payment success error:",
        error
      );
      app.innerHTML = `
        <div class="center">
          <div class="icon">✓</div>
          <h1>
            Payment Received
          </h1>
          <p class="subtitle">
            Your payment reference has been received.
          </p>
        </div>
        <div class="status">
          <div class="status-title">
            🟡 Processing Your Order
          </div>
          <div class="status-text">
            We are checking your order information.
            <strong>
              Please do not make another payment.
            </strong>
          </div>
        </div>
        <div class="error">
          <strong>
            Payment Reference:
          </strong>
          <br>
          ${escapeHTML(reference)}
          <br><br>
          Your payment may already be successful.
          If the order does not appear shortly,
          contact TokBoost GH support with this
          reference.
        </div>
        <a
          class="button"
          href="/track-order.html?reference=${encodeURIComponent(
            reference
          )}"
        >
          Track My Order
        </a>
        <a
          class="button secondary"
          href="/"
        >
          Back to TokBoost GH
        </a>
      `;
    }
  }
  verifyPayment();
</script>
</body>
</html>
