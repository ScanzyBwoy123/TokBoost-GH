<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#000000">

  <title>Payment Status — TokBoost GH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f8;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0, 0, 0, .08);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #111;
      color: white;
      display: grid;
      place-items: center;
      font-size: 32px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    .details {
      margin-top: 25px;
      padding: 18px;
      background: #f5f5f5;
      border-radius: 15px;
      text-align: left;
      display: none;
    }

    .details div {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 7px 0;
      font-size: 14px;
    }

    .details strong {
      text-align: right;
      word-break: break-word;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 22px;
      border-radius: 12px;
      background: #111;
      color: white;
      text-decoration: none;
      font-weight: 800;
    }

    .error {
      color: #b00020;
    }

    .loading {
      color: #666;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="icon" id="statusIcon">
      ⏳
    </div>

    <h1 id="statusTitle">
      Verifying payment...
    </h1>

    <p id="statusMessage" class="loading">
      Please wait while we confirm your transaction with Paystack.
    </p>

    <div class="details" id="paymentDetails">

      <div>
        <span>Package</span>
        <strong id="packageName">—</strong>
      </div>

      <div>
        <span>Amount</span>
        <strong id="amount">—</strong>
      </div>

      <div>
        <span>Reference</span>
        <strong id="reference">—</strong>
      </div>

    </div>

    <a
      href="/"
      class="button"
      id="homeButton"
      style="display:none;"
    >
      Back to TokBoost GH
    </a>

  </main>

  <script>

    // ========================================================
    // TOKBOOST GH
    // PAYMENT SUCCESS / VERIFICATION PAGE
    // ========================================================

    async function verifyPayment() {

      // ------------------------------------------------------
      // 1. Get Paystack reference from the URL
      // ------------------------------------------------------

      const params =
        new URLSearchParams(
          window.location.search
        );

      const reference =
        params.get("reference");

      // Some Paystack redirects may use trxref.
      // Support both formats.
      const trxref =
        params.get("trxref");

      const paymentReference =
        reference || trxref;

      // ------------------------------------------------------
      // 2. Make sure we have a payment reference
      // ------------------------------------------------------

      if (!paymentReference) {

        showError(
          "No payment reference was found. Please contact TokBoost GH support."
        );

        return;
      }

      // ------------------------------------------------------
      // 3. Show reference immediately
      // ------------------------------------------------------

      document.getElementById(
        "reference"
      ).textContent =
        paymentReference;

      try {

        // ----------------------------------------------------
        // 4. Ask our secure Netlify Function to verify
        //    the payment with Paystack.
        //
        // IMPORTANT:
        // We only send the reference.
        //
        // The server gets the package name and amount
        // directly from Paystack transaction metadata.
        // ----------------------------------------------------

        const response =
          await fetch(
            "/.netlify/functions/verify-payment",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                reference:
                  paymentReference
              })
            }
          );

        // ----------------------------------------------------
        // 5. Read server response safely
        // ----------------------------------------------------

        let data;

        try {
          data =
            await response.json();
        } catch (jsonError) {

          throw new Error(
            "The payment verification service returned an invalid response."
          );
        }

        // ----------------------------------------------------
        // 6. Check verification result
        // ----------------------------------------------------

        if (
          !response.ok ||
          !data.status ||
          !data.paid
        ) {

          throw new Error(
            data.error ||
            "Payment could not be verified."
          );
        }

        // ----------------------------------------------------
        // 7. PAYMENT SUCCESS
        // ----------------------------------------------------

        document.getElementById(
          "statusIcon"
        ).textContent = "✓";

        document.getElementById(
          "statusTitle"
        ).textContent =
          "Payment Successful!";

        document.getElementById(
          "statusMessage"
        ).textContent =
          "Your payment has been successfully verified.";

        document.getElementById(
          "statusMessage"
        ).className = "";

        // ----------------------------------------------------
        // 8. Display package information returned by server
        // ----------------------------------------------------

        document.getElementById(
          "packageName"
        ).textContent =
          data.packageName ||
          "Promotion Campaign";

        document.getElementById(
          "amount"
        ).textContent =
          "GH₵" +
          Number(data.amount || 0).toFixed(2);

        document.getElementById(
          "reference"
        ).textContent =
          data.reference ||
          paymentReference;

        document.getElementById(
          "paymentDetails"
        ).style.display =
          "block";

        document.getElementById(
          "homeButton"
        ).style.display =
          "inline-block";

        // ----------------------------------------------------
        // 9. Clean up old localStorage values if they exist.
        //
        // These are no longer required for verification.
        // ----------------------------------------------------

        localStorage.removeItem(
          "tokboost_package_name"
        );

        localStorage.removeItem(
          "tokboost_payment_reference"
        );

      } catch (error) {

        console.error(
          "Payment verification error:",
          error
        );

        showError(
          error.message ||
          "We could not verify the payment."
        );
      }
    }


    // ========================================================
    // SHOW ERROR
    // ========================================================

    function showError(message) {

      document.getElementById(
        "statusIcon"
      ).textContent = "×";

      document.getElementById(
        "statusTitle"
      ).textContent =
        "Payment Not Verified";

      const messageElement =
        document.getElementById(
          "statusMessage"
        );

      messageElement.textContent =
        message;

      messageElement.className =
        "error";

      document.getElementById(
        "homeButton"
      ).style.display =
        "inline-block";
    }


    // ========================================================
    // START VERIFICATION
    // ========================================================

    verifyPayment();

  </script>

</body>
</html>
