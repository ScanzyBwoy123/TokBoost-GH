<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>TokBoost GH — Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f5f7;
      color: #111;
      min-height: 100vh;
    }

    header {
      background: #000;
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    header h1 {
      font-size: 21px;
      font-weight: 900;
    }

    header span {
      color: #ff2d55;
    }

    .admin-badge {
      font-size: 12px;
      background: #222;
      padding: 7px 11px;
      border-radius: 20px;
    }

    .container {
      max-width: 1250px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    .login-card,
    .dashboard {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }

    .login-card {
      max-width: 430px;
      margin: 70px auto;
      padding: 30px 24px;
    }

    .login-card h2 {
      margin-bottom: 8px;
    }

    .muted {
      color: #777;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      margin: 20px 0 7px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      margin-top: 20px;
      background: #111;
      color: #fff;
    }

    .primary:hover {
      background: #333;
    }

    .logout {
      background: #fff;
      color: #111;
    }

    .error {
      background: #fff0f0;
      border: 1px solid #efb5b5;
      color: #9b1c1c;
      padding: 13px;
      border-radius: 10px;
      margin-top: 15px;
      line-height: 1.5;
      display: none;
    }

    .dashboard {
      padding: 20px;
    }

    .dashboard-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .dashboard-top h2 {
      font-size: 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat {
      padding: 18px;
      border: 1px solid #eee;
      border-radius: 15px;
      background: #fafafa;
    }

    .stat small {
      color: #777;
      display: block;
      margin-bottom: 8px;
    }

    .stat strong {
      font-size: 25px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 190px auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    .refresh {
      background: #111;
      color: #fff;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #eee;
      border-radius: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 14px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      background: #fafafa;
      font-size: 12px;
      text-transform: uppercase;
      color: #666;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .reference {
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
    }

    .target {
      max-width: 220px;
      word-break: break-word;
    }

    .status-select {
      min-width: 170px;
      padding: 9px;
    }

    .save {
      margin-top: 7px;
      background: #111;
      color: #fff;
      width: 100%;
      font-size: 12px;
    }

    .save:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .empty,
    .loading {
      text-align: center;
      padding: 35px;
      color: #777;
    }

    .notice {
      margin-bottom: 18px;
      padding: 13px 15px;
      border-radius: 11px;
      display: none;
      line-height: 1.5;
    }

    .notice.success {
      display: block;
      background: #e9fff1;
      color: #126b36;
      border: 1px solid #b8e8c9;
    }

    .notice.error {
      display: block;
      background: #fff0f0;
      color: #9b1c1c;
      border: 1px solid #efb5b5;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .dashboard-top {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 15px 10px 40px;
      }

      .dashboard {
        padding: 14px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat strong {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Tok<span>Boost</span> GH</h1>
  <div class="admin-badge">ADMIN</div>
</header>

<main class="container">

  <!-- ======================================================
       ADMIN LOGIN
       ====================================================== -->

  <section class="login-card" id="loginSection">

    <h2>Admin Login</h2>

    <p class="muted">
      Sign in to manage TokBoost GH orders.
    </p>

    <form id="loginForm">

      <label for="adminEmail">
        Admin Email
      </label>

      <input
        id="adminEmail"
        type="email"
        autocomplete="username"
        required
        placeholder="Admin email"
      >

      <label for="adminPassword">
        Admin Password
      </label>

      <input
        id="adminPassword"
        type="password"
        autocomplete="current-password"
        required
        placeholder="Password"
      >

      <button
        class="primary"
        type="submit"
        id="loginButton"
      >
        Sign In
      </button>

    </form>

    <div
      class="error"
      id="loginError"
    ></div>

  </section>


  <!-- ======================================================
       ADMIN DASHBOARD
       ====================================================== -->

  <section
    class="dashboard"
    id="dashboard"
    hidden
  >

    <div class="dashboard-top">

      <div>
        <h2>Order Management</h2>

        <p class="muted">
          Manage TokBoost GH customer orders.
        </p>
      </div>

      <button
        class="logout"
        id="logoutButton"
      >
        Sign Out
      </button>

    </div>


    <div
      class="notice"
      id="notice"
    ></div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <small>Total Orders</small>
        <strong id="totalOrders">0</strong>
      </div>

      <div class="stat">
        <small>Processing</small>
        <strong id="processingOrders">0</strong>
      </div>

      <div class="stat">
        <small>In Progress</small>
        <strong id="progressOrders">0</strong>
      </div>

      <div class="stat">
        <small>Completed</small>
        <strong id="completedOrders">0</strong>
      </div>

    </div>


    <!-- SEARCH -->

    <div class="toolbar">

      <input
        id="searchInput"
        type="search"
        placeholder="Search reference, email, package or TikTok target..."
      >

      <select id="statusFilter">

        <option value="all">
          All statuses
        </option>

        <option value="processing">
          Processing
        </option>

        <option value="in_progress">
          Promotion In Progress
        </option>

        <option value="completed">
          Completed
        </option>

      </select>

      <button
        class="refresh"
        id="refreshButton"
      >
        Refresh Orders
      </button>

    </div>


    <!-- ORDERS -->

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Reference</th>
            <th>Customer</th>
            <th>Package</th>
            <th>Amount</th>
            <th>TikTok Target</th>
            <th>Status</th>
            <th>Created</th>
          </tr>

        </thead>

        <tbody id="ordersBody">

          <tr>
            <td
              colspan="7"
              class="loading"
            >
              Loading orders...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<script>
"use strict";

/*
  IMPORTANT SECURITY NOTE

  This page NEVER contains:

  - SUPABASE_SERVICE_ROLE_KEY
  - Paystack secret key
  - Admin database credentials

  Those remain on Netlify's server.

  The following API endpoints will be created
  separately:

  /.netlify/functions/admin-login
  /.netlify/functions/admin-orders
  /.netlify/functions/admin-update-order
*/


const loginSection =
  document.getElementById(
    "loginSection"
  );

const dashboard =
  document.getElementById(
    "dashboard"
  );

const loginForm =
  document.getElementById(
    "loginForm"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const ordersBody =
  document.getElementById(
    "ordersBody"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const statusFilter =
  document.getElementById(
    "statusFilter"
  );

const refreshButton =
  document.getElementById(
    "refreshButton"
  );

const logoutButton =
  document.getElementById(
    "logoutButton"
  );

const notice =
  document.getElementById(
    "notice"
  );


let orders = [];


/* ============================================================
   HELPERS
   ============================================================ */

function escapeHTML(value) {

  return String(
    value == null ? "" : value
  )
  .replace(/&/g, "&amp;")
  .replace(/</g, "&lt;")
  .replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;")
  .replace(/'/g, "&#039;");

}


function showLoginError(message) {

  loginError.textContent =
    message || "Login failed.";

  loginError.style.display =
    "block";

}


function showNotice(
  message,
  type
) {

  notice.textContent =
    message;

  notice.className =
    "notice " +
    (type === "error"
      ? "error"
      : "success");

}


function hideNotice() {

  notice.className =
    "notice";

  notice.textContent =
    "";

}


function formatDate(value) {

  if (!value) {
    return "—";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return escapeHTML(value);
  }

  return date.toLocaleString();

}


function formatAmount(value) {

  const number =
    Number(value || 0);

  return (
    "GH₵" +
    number.toFixed(2)
  );

}


/* ============================================================
   LOGIN
   ============================================================ */

loginForm.addEventListener(
  "submit",
  async function (event) {

    event.preventDefault();

    loginError.style.display =
      "none";

    hideNotice();

    loginButton.disabled =
      true;

    loginButton.textContent =
      "Signing in...";

    const email =
      document
        .getElementById(
          "adminEmail"
        )
        .value
        .trim();

    const password =
      document
        .getElementById(
          "adminPassword"
        )
        .value;

    try {

      const response =
        await fetch(
          "/.netlify/functions/admin-login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                email,
                password
              }),

            credentials:
              "include"
          }
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.status
      ) {

        throw new Error(
          data.error ||
          "Invalid admin credentials."
        );

      }

      loginSection.hidden =
        true;

      dashboard.hidden =
        false;

      await loadOrders();

    } catch (error) {

      console.error(
        "Admin login error:",
        error
      );

      showLoginError(
        error.message ||
        "Unable to sign in."
      );

    } finally {

      loginButton.disabled =
        false;

      loginButton.textContent =
        "Sign In";

    }

  }
);


/* ============================================================
   LOAD ORDERS
   ============================================================ */

async function loadOrders() {

  ordersBody.innerHTML = `
    <tr>
      <td colspan="7" class="loading">
        Loading orders...
      </td>
    </tr>
  `;

  try {

    const response =
      await fetch(
        "/.netlify/functions/admin-orders",
        {
          method: "GET",

          credentials:
            "include"
        }
      );

    const data =
      await response.json();

    if (
      response.status === 401 ||
      response.status === 403
    ) {

      logout();

      return;

    }

    if (
      !response.ok ||
      !data.status
    ) {

      throw new Error(
        data.error ||
        "Unable to load orders."
      );

    }

    orders =
      Array.isArray(data.orders)
        ? data.orders
        : [];

    updateStats();

    renderOrders();

  } catch (error) {

    console.error(
      "Load orders error:",
      error
    );

    ordersBody.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          ${escapeHTML(
            error.message ||
            "Unable to load orders."
          )}
        </td>
      </tr>
    `;

    showNotice(
      error.message ||
      "Unable to load orders.",
      "error"
    );

  }

}


/* ============================================================
   STATS
   ============================================================ */

function updateStats() {

  const processing =
    orders.filter(
      order =>
        order.status ===
        "processing"
    ).length;

  const inProgress =
    orders.filter(
      order =>
        order.status ===
        "in_progress"
    ).length;

  const completed =
    orders.filter(
      order =>
        order.status ===
        "completed"
    ).length;

  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length;

  document.getElementById(
    "processingOrders"
  ).textContent =
    processing;

  document.getElementById(
    "progressOrders"
  ).textContent =
    inProgress;

  document.getElementById(
    "completedOrders"
  ).textContent =
    completed;

}


/* ============================================================
   FILTER ORDERS
   ============================================================ */

function getFilteredOrders() {

  const search =
    searchInput
      .value
      .trim()
      .toLowerCase();

  const status =
    statusFilter.value;

  return orders.filter(
    order => {

      const matchesSearch =
        !search ||
        String(
          order.reference || ""
        )
        .toLowerCase()
        .includes(search) ||

        String(
          order.email || ""
        )
        .toLowerCase()
        .includes(search) ||

        String(
          order.package_name || ""
        )
        .toLowerCase()
        .includes(search) ||

        String(
          order.tiktok_target || ""
        )
        .toLowerCase()
        .includes(search);

      const matchesStatus =
        status === "all" ||
        order.status === status;

      return (
        matchesSearch &&
        matchesStatus
      );

    }
  );

}


/* ============================================================
   RENDER ORDERS
   ============================================================ */

function renderOrders() {

  const filtered =
    getFilteredOrders();

  if (!filtered.length) {

    ordersBody.innerHTML = `
      <tr>
        <td colspan="7" class="empty">
          No orders found.
        </td>
      </tr>
    `;

    return;

  }

  ordersBody.innerHTML =
    filtered
      .map(
        order => {

          const status =
            order.status ||
            "processing";

          return `
            <tr>

              <td>
                <div class="reference">
                  ${escapeHTML(
                    order.reference
                  )}
                </div>
              </td>

              <td>
                <strong>
                  ${escapeHTML(
                    order.customer_name ||
                    "Customer"
                  )}
                </strong>

                <br>

                <small>
                  ${escapeHTML(
                    order.email || ""
                  )}
                </small>
              </td>

              <td>
                ${escapeHTML(
                  order.package_name ||
                  ""
                )}
              </td>

              <td>
                <strong>
                  ${formatAmount(
                    order.amount
                  )}
                </strong>
              </td>

              <td>
                <div class="target">
                  ${escapeHTML(
                    order.tiktok_target ||
                    ""
                  )}
                </div>
              </td>

              <td>

                <select
                  class="status-select"
                  data-id="${escapeHTML(
                    order.id
                  )}"
                >

                  <option
                    value="processing"
                    ${
                      status ===
                      "processing"
                        ? "selected"
                        : ""
                    }
                  >
                    Processing
                  </option>

                  <option
                    value="in_progress"
                    ${
                      status ===
                      "in_progress"
                        ? "selected"
                        : ""
                    }
                  >
                    Promotion In Progress
                  </option>

                  <option
                    value="completed"
                    ${
                      status ===
                      "completed"
                        ? "selected"
                        : ""
                    }
                  >
                    Completed
                  </option>

                </select>

                <button
                  class="save"
                  data-save-id="${escapeHTML(
                    order.id
                  )}"
                >
                  Save Status
                </button>

              </td>

              <td>
                ${formatDate(
                  order.created_at
                )}
              </td>

            </tr>
          `;

        }
      )
      .join("");

}


/* ============================================================
   SAVE STATUS
   ============================================================ */

ordersBody.addEventListener(
  "click",
  async function (event) {

    const button =
      event.target.closest(
        "[data-save-id]"
      );

    if (!button) {
      return;
    }

    const id =
      button.dataset.saveId;

    const select =
      ordersBody.querySelector(
        `select[data-id="${CSS.escape(id)}"]`
      );

    if (!select) {
      return;
    }

    const status =
      select.value;

    button.disabled =
      true;

    button.textContent =
      "Saving...";

    hideNotice();

    try {

      const response =
        await fetch(
          "/.netlify/functions/admin-update-order",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            credentials:
              "include",

            body:
              JSON.stringify({
                id,
                status
              })
          }
        );

      const data =
        await response.json();

      if (
        response.status === 401 ||
        response.status === 403
      ) {

        logout();

        return;

      }

      if (
        !response.ok ||
        !data.status
      ) {

        throw new Error(
          data.error ||
          "Unable to update order."
        );

      }

      const order =
        orders.find(
          item =>
            String(item.id) ===
            String(id)
        );

      if (order) {
        order.status =
          status;
      }

      updateStats();

      renderOrders();

      showNotice(
        "Order status updated successfully.",
        "success"
      );

    } catch (error) {

      console.error(
        "Update order error:",
        error
      );

      showNotice(
        error.message ||
        "Unable to update order.",
        "error"
      );

      button.disabled =
        false;

      button.textContent =
        "Save Status";

    }

  }
);


/* ============================================================
   SEARCH + FILTER
   ============================================================ */

searchInput.addEventListener(
  "input",
  renderOrders
);

statusFilter.addEventListener(
  "change",
  renderOrders
);

refreshButton.addEventListener(
  "click",
  async function () {

    hideNotice();

    await loadOrders();

  }
);


/* ============================================================
   LOGOUT
   ============================================================ */

logoutButton.addEventListener(
  "click",
  logout
);


async function logout() {

  try {

    await fetch(
      "/.netlify/functions/admin-logout",
      {
        method: "POST",
        credentials: "include"
      }
    );

  } catch (error) {

    console.error(
      "Logout error:",
      error
    );

  }

  orders = [];

  dashboard.hidden =
    true;

  loginSection.hidden =
    false;

  document
    .getElementById(
      "adminPassword"
    )
    .value = "";

}


/* ============================================================
   CHECK EXISTING ADMIN SESSION
   ============================================================ */

async function checkSession() {

  try {

    const response =
      await fetch(
        "/.netlify/functions/admin-session",
        {
          method: "GET",
          credentials:
            "include"
        }
      );

    if (!response.ok) {
      return;
    }

    const data =
      await response.json();

    if (data.status) {

      loginSection.hidden =
        true;

      dashboard.hidden =
        false;

      await loadOrders();

    }

  } catch (error) {

    console.error(
      "Session check error:",
      error
    );

  }

}


/* ============================================================
   START
   ============================================================ */

checkSession();

</script>

</body>
</html>
