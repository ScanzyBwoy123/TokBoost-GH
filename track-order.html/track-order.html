<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order — TokBoost GH</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f7;
      color: #111;
      min-height: 100vh;
    }
    header {
      background: #000;
      color: #fff;
      padding: 18px 20px;
      text-align: center;
      font-size: 21px;
      font-weight: 900;
    }
    header span {
      color: #ff2d55;
    }
    .container {
      max-width: 650px;
      margin: auto;
      padding: 35px 18px 60px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }
    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }
    .intro {
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }
    input:focus {
      border-color: #111;
    }
    button {
      width: 100%;
      border: none;
      background: #111;
      color: #fff;
      padding: 15px;
      border-radius: 12px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 14px;
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    .result {
      margin-top: 28px;
    }
    .status {
      padding: 17px;
      border-radius: 15px;
      margin-bottom: 20px;
    }
    .status.processing {
      background: #fff8df;
      border: 1px solid #f1df9e;
      color: #6f5b00;
    }
    .status.progress {
      background: #eef6ff;
      border: 1px solid #b9d8ff;
      color: #15558c;
    }
    .status.completed {
      background: #e8fff1;
      border: 1px solid #b8e8c9;
      color: #126b34;
    }
    .status.cancelled {
      background: #fff0f0;
      border: 1px solid #f2b8b8;
      color: #9b1c1c;
    }
    .status-title {
      font-weight: 900;
      font-size: 18px;
      margin-bottom: 5px;
    }
    .status-description {
      font-size: 13px;
      line-height: 1.5;
    }
    .details {
      border-top: 1px solid #eee;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }
    .label-text {
      color: #777;
      font-size: 13px;
    }
    .value {
      font-weight: 800;
      text-align: right;
      word-break: break-word;
      max-width: 60%;
    }
    .error {
      margin-top: 20px;
      background: #fff0f0;
      border: 1px solid #f2b8b8;
      color: #9b1c1c;
      border-radius: 14px;
      padding: 15px;
      font-size: 13px;
      line-height: 1.5;
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 20px;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #111;
      font-weight: 800;
      text-decoration: none;
      font-size: 14px;
    }
    .timeline {
      margin: 25px 0;
    }
    .timeline-title {
      font-weight: 900;
      margin-bottom: 17px;
    }
    .timeline-step {
      display: flex;
      gap: 12px;
      margin-bottom: 17px;
    }
    .dot {
      width: 29px;
      height: 29px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #eee;
      display: grid;
      place-items: center;
      color: #777;
      font-size: 12px;
      font-weight: 900;
    }
    .dot.done {
      background: #159447;
      color: #fff;
    }
    .dot.active {
      background: #111;
      color: #fff;
    }
    .timeline-step strong {
      display: block;
      font-size: 14px;
      margin-bottom: 3px;
    }
    .timeline-step small {
      color: #777;
      font-size: 12px;
      line-height: 1.4;
    }
    @media (max-width: 500px) {
      .card {
        padding: 25px 17px;
      }
      h1 {
        font-size: 27px;
      }
      .row {
        flex-direction: column;
        gap: 5px;
      }
      .value {
        text-align: left;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
<header>
  Tok<span>Boost</span> GH
</header>
<main class="container">
  <div class="card">
    <h1>Track Your Order</h1>
    <p class="intro">
      Enter your TokBoost payment reference to check
      the current status of your order.
    </p>
    <form id="trackForm">
      <label for="reference">
        Payment / Order Reference
      </label>
      <input
        id="reference"
        type="text"
        placeholder="TOKBOOST-..."
        required
        autocomplete="off"
      >
      <button
        id="trackButton"
        type="submit"
      >
        Track Order
      </button>
    </form>
    <div
      id="result"
      class="result"
    ></div>
    <a
      class="back"
      href="/"
    >
      ← Back to TokBoost GH
    </a>
  </div>
</main>
<script>
  const form =
    document.getElementById("trackForm");
  const input =
    document.getElementById("reference");
  const button =
    document.getElementById("trackButton");
  const result =
    document.getElementById("result");
  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  function statusInfo(status) {
    const normalized =
      String(status || "")
        .toLowerCase()
        .trim();
    if (
      normalized === "completed" ||
      normalized === "complete"
    ) {
      return {
        className: "completed",
        title: "🟢 Order Completed",
        description:
          "Your TokBoost campaign has been completed."
      };
    }
    if (
      normalized === "in_progress" ||
      normalized === "in progress" ||
      normalized === "processing_campaign"
    ) {
      return {
        className: "progress",
        title: "🔵 Promotion In Progress",
        description:
          "Your promotion campaign is currently in progress."
      };
    }
    if (
      normalized === "cancelled" ||
      normalized === "canceled"
    ) {
      return {
        className: "cancelled",
        title: "🔴 Order Cancelled",
        description:
          "This order has been cancelled. Please contact TokBoost GH support."
      };
    }
    return {
      className: "processing",
      title: "🟡 Order Processing",
      description:
        "Your order has been received and is being prepared."
    };
  }
  function timelineHTML(status) {
    const normalized =
      String(status || "")
        .toLowerCase()
        .trim();
    const processingDone =
      normalized !== "";
    const inProgress =
      normalized === "in_progress" ||
      normalized === "in progress" ||
      normalized === "processing_campaign" ||
      normalized === "completed" ||
      normalized === "complete";
    const completed =
      normalized === "completed" ||
      normalized === "complete";
    return `
      <div class="timeline">
        <div class="timeline-title">
          Order Progress
        </div>
        <div class="timeline-step">
          <div class="dot done">
            ✓
          </div>
          <div>
            <strong>
              Payment Received
            </strong>
            <small>
              Your payment was successfully received.
            </small>
          </div>
        </div>
        <div class="timeline-step">
          <div class="dot ${
            inProgress || completed
              ? "done"
              : "active"
          }">
            ${
              inProgress || completed
                ? "✓"
                : "2"
            }
          </div>
          <div>
            <strong>
              Order Processing
            </strong>
            <small>
              Your order is being prepared.
            </small>
          </div>
        </div>
        <div class="timeline-step">
          <div class="dot ${
            inProgress
              ? "done"
              : ""
          }">
            ${
              inProgress
                ? "✓"
                : "3"
            }
          </div>
          <div>
            <strong>
              Promotion In Progress
            </strong>
            <small>
              Your campaign will appear here when processing begins.
            </small>
          </div>
        </div>
        <div class="timeline-step">
          <div class="dot ${
            completed
              ? "done"
              : ""
          }">
            ${
              completed
                ? "✓"
                : "4"
            }
          </div>
          <div>
            <strong>
              Completed
            </strong>
            <small>
              Your order will show as completed when the campaign is finished.
            </small>
          </div>
        </div>
      </div>
    `;
  }
  async function trackOrder(reference) {
    result.innerHTML = `
      <div class="loading">
        Checking your order...
      </div>
    `;
    button.disabled = true;
    button.textContent = "Checking...";
    try {
      const response =
        await fetch(
          `/.netlify/functions/get-order?reference=${encodeURIComponent(reference)}`
        );
      const data =
        await response.json();
      if (
        !response.ok ||
        !data.status ||
        !data.order
      ) {
        throw new Error(
          data.error ||
          "Order could not be found."
        );
      }
      const order =
        data.order;
      const status =
        statusInfo(order.status);
      result.innerHTML = `
        <div class="status ${status.className}">
          <div class="status-title">
            ${status.title}
          </div>
          <div class="status-description">
            ${status.description}
          </div>
        </div>
        <div class="details">
          <div class="row">
            <div class="label-text">
              Package
            </div>
            <div class="value">
              ${escapeHTML(
                order.packageName
              )}
            </div>
          </div>
          <div class="row">
            <div class="label-text">
              Amount
            </div>
            <div class="value">
              GH₵${escapeHTML(
                Number(order.amount || 0)
                  .toFixed(2)
              )}
            </div>
          </div>
          <div class="row">
            <div class="label-text">
              Reference
            </div>
            <div class="value">
              ${escapeHTML(
                order.reference
              )}
            </div>
          </div>
          ${
            order.tiktokTarget
              ? `
                <div class="row">
                  <div class="label-text">
                    TikTok Target
                  </div>
                  <div class="value">
                    ${escapeHTML(
                      order.tiktokTarget
                    )}
                  </div>
                </div>
              `
              : ""
          }
          <div class="row">
            <div class="label-text">
              Order Status
            </div>
            <div class="value">
              ${escapeHTML(
                order.status
              )}
            </div>
          </div>
        </div>
        ${timelineHTML(
          order.status
        )}
      `;
    } catch (error) {
      console.error(
        "Track order error:",
        error
      );
      result.innerHTML = `
        <div class="error">
          <strong>
            Order not found
          </strong>
          <br><br>
          ${
            escapeHTML(
              error.message
            )
          }
          <br><br>
          Please check your payment reference
          and try again.
          <br><br>
          If you already paid, <strong>
          do not make another payment.</strong>
          Contact TokBoost GH support if necessary.
        </div>
      `;
    } finally {
      button.disabled = false;
      button.textContent =
        "Track Order";
    }
  }
  form.addEventListener(
    "submit",
    function(event) {
      event.preventDefault();
      const reference =
        input.value.trim();
      if (!reference) {
        result.innerHTML = `
          <div class="error">
            Please enter your payment reference.
          </div>
        `;
        return;
      }
      trackOrder(reference);
    }
  );
  // ----------------------------------------------------------
  // Automatically use a reference from the URL if provided.
  // Example:
  // /track-order.html?reference=TOKBOOST-123
  // ----------------------------------------------------------
  const urlParams =
    new URLSearchParams(
      window.location.search
    );
  const urlReference =
    urlParams.get("reference");
  if (urlReference) {
    input.value =
      urlReference;
    trackOrder(
      urlReference
    );
  }
</script>
</body>
</html>
