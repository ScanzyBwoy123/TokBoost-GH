<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order — TokBoost GH</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 0;
      color: #111;
    }
    header {
      background: #000;
      color: #fff;
      padding: 18px;
      text-align: center;
      font-size: 22px;
      font-weight: 900;
    }
    header span {
      color: #ff2d55;
    }
    .container {
      max-width: 650px;
      margin: auto;
      padding: 30px 18px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 {
      text-align: center;
      margin-bottom: 8px;
    }
    .intro {
      text-align: center;
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button,
    .button {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      box-sizing: border-box;
    }
    button:disabled {
      opacity: .6;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    .status {
      margin-top: 25px;
      padding: 18px;
      border-radius: 14px;
      background: #fff8df;
      border: 1px solid #f1df9e;
    }
    .status h2 {
      margin: 0 0 7px;
      font-size: 19px;
    }
    .status p {
      margin: 0;
      line-height: 1.5;
      color: #6f5b00;
    }
    .details {
      margin-top: 25px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
    }
    .label {
      color: #777;
      font-size: 13px;
    }
    .value {
      font-weight: bold;
      text-align: right;
      word-break: break-word;
    }
    .error {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #fff0f0;
      border: 1px solid #f2b8b8;
      color: #9b1c1c;
      line-height: 1.5;
    }
    .success {
      background: #e8fff1;
      border-color: #b8e8c9;
    }
    .progress {
      margin-top: 28px;
    }
    .progress h3 {
      margin-bottom: 18px;
    }
    .step {
      display: flex;
      gap: 12px;
      margin-bottom: 17px;
    }
    .dot {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #eee;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: bold;
    }
    .dot.done {
      background: #159447;
      color: #fff;
    }
    .step strong {
      display: block;
      margin-bottom: 4px;
    }
    .step small {
      color: #777;
      line-height: 1.4;
    }
    @media (max-width: 500px) {
      .card {
        padding: 20px;
      }
      .row {
        flex-direction: column;
        gap: 5px;
      }
      .value {
        text-align: left;
      }
    }
  </style>
</head>
<body>
<header>
  Tok<span>Boost</span> GH
</header>
<div class="container">
  <div class="card">
    <h1>Track Your Order</h1>
    <p class="intro">
      Enter your payment reference to see the current
      status of your TokBoost order.
    </p>
    <form id="trackForm">
      <label for="reference">
        Payment / Order Reference
      </label>
      <input
        id="reference"
        type="text"
        placeholder="TOKBOOST-..."
        autocomplete="off"
        required
      >
      <button id="trackButton" type="submit">
        Track Order
      </button>
    </form>
    <div id="result"></div>
  </div>
</div>
<script>
  const form =
    document.getElementById("trackForm");
  const input =
    document.getElementById("reference");
  const button =
    document.getElementById("trackButton");
  const result =
    document.getElementById("result");
  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  function getStatus(status) {
    const value =
      String(status || "")
        .toLowerCase()
        .trim();
    if (
      value === "completed" ||
      value === "complete"
    ) {
      return {
        title: "🟢 Order Completed",
        text: "Your promotion has been completed.",
        completed: true
      };
    }
    if (
      value === "in_progress" ||
      value === "in progress" ||
      value === "processing_campaign"
    ) {
      return {
        title: "🔵 Promotion In Progress",
        text: "Your TikTok promotion is currently being processed.",
        completed: false
      };
    }
    return {
      title: "🟡 Order Processing",
      text: "Your order has been received and is being prepared.",
      completed: false
    };
  }
  function showOrder(order) {
    const status =
      getStatus(order.status);
    result.innerHTML = `
      <div class="status ${
        status.completed
          ? "success"
          : ""
      }">
        <h2>
          ${status.title}
        </h2>
        <p>
          ${status.text}
        </p>
      </div>
      <div class="details">
        <div class="row">
          <div class="label">Package</div>
          <div class="value">
            ${escapeHTML(
              order.package_name ||
              order.packageName
            )}
          </div>
        </div>
        <div class="row">
          <div class="label">Amount</div>
          <div class="value">
            GH₵${Number(
              order.amount || 0
            ).toFixed(2)}
          </div>
        </div>
        <div class="row">
          <div class="label">Reference</div>
          <div class="value">
            ${escapeHTML(
              order.reference
            )}
          </div>
        </div>
        ${
          order.email
            ? `
              <div class="row">
                <div class="label">Email</div>
                <div class="value">
                  ${escapeHTML(order.email)}
                </div>
              </div>
            `
            : ""
        }
        ${
          order.tiktok_target
            ? `
              <div class="row">
                <div class="label">TikTok Target</div>
                <div class="value">
                  ${escapeHTML(order.tiktok_target)}
                </div>
              </div>
            `
            : ""
        }
        <div class="row">
          <div class="label">Status</div>
          <div class="value">
            ${escapeHTML(
              order.status || "processing"
            )}
          </div>
        </div>
      </div>
      <div class="progress">
        <h3>Order Progress</h3>
        <div class="step">
          <div class="dot done">
            ✓
          </div>
          <div>
            <strong>
              Payment Received
            </strong>
            <small>
              Your payment has been verified.
            </small>
          </div>
        </div>
        <div class="step">
          <div class="dot done">
            ✓
          </div>
          <div>
            <strong>
              Order Processing
            </strong>
            <small>
              Your order has been received.
            </small>
          </div>
        </div>
        <div class="step">
          <div class="dot ${
            status.completed ||
            String(order.status || "")
              .toLowerCase()
              .includes("progress")
              ? "done"
              : ""
          }">
            ${
              status.completed ||
              String(order.status || "")
                .toLowerCase()
                .includes("progress")
                ? "✓"
                : "3"
            }
          </div>
          <div>
            <strong>
              Promotion In Progress
            </strong>
            <small>
              Your promotion will update here when fulfillment begins.
            </small>
          </div>
        </div>
        <div class="step">
          <div class="dot ${
            status.completed
              ? "done"
              : ""
          }">
            ${
              status.completed
                ? "✓"
                : "4"
            }
          </div>
          <div>
            <strong>
              Completed
            </strong>
            <small>
              Your order will be marked completed when finished.
            </small>
          </div>
        </div>
      </div>
    `;
  }
  async function trackOrder(reference) {
    button.disabled = true;
    button.textContent =
      "Checking...";
    result.innerHTML = `
      <div class="loading">
        Checking your order...
      </div>
    `;
    try {
      const response =
        await fetch(
          `/.netlify/functions/get-order?reference=${encodeURIComponent(reference)}`
        );
      const data =
        await response.json();
      if (
        !response.ok ||
        !data.status ||
        !data.order
      ) {
        throw new Error(
          data.error ||
          "Order not found."
        );
      }
      showOrder(
        data.order
      );
    } catch (error) {
      console.error(
        "Track order error:",
        error
      );
      result.innerHTML = `
        <div class="error">
          <strong>
            We couldn't find your order.
          </strong>
          <br><br>
          ${escapeHTML(
            error.message
          )}
          <br><br>
          Check that your payment reference
          is correct. If you already paid,
          <strong>do not make another payment.</strong>
        </div>
      `;
    } finally {
      button.disabled = false;
      button.textContent =
        "Track Order";
    }
  }
  form.addEventListener(
    "submit",
    function(event) {
      event.preventDefault();
      const reference =
        input.value.trim();
      if (!reference) {
        return;
      }
      trackOrder(reference);
    }
  );
  // Automatically load reference from URL.
  const params =
    new URLSearchParams(
      window.location.search
    );
  const urlReference =
    params.get("reference");
  if (urlReference) {
    input.value =
      urlReference;
    trackOrder(
      urlReference
    );
  }
</script>
</body>
</html>
