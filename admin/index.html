<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">

  <title>TokBoost GH — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #111827, #1f2937);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      margin: 0;
      font-size: 28px;
    }

    .logo p {
      margin: 8px 0 0;
      color: #6b7280;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #111827;
    }

    .field {
      margin-bottom: 17px;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: 700;
      transition: .15s;
    }

    .btn:hover {
      opacity: .9;
    }

    .btn-primary {
      width: 100%;
      background: #111827;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .error {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 9px;
      background: #fee2e2;
      color: #991b1b;
      font-size: 14px;
    }

    /* DASHBOARD */

    #dashboard {
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px 22px;
    }

    .header-inner {
      max-width: 1400px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .header-title h1 {
      margin: 0;
      font-size: 22px;
    }

    .header-title p {
      margin: 4px 0 0;
      color: #cbd5e1;
      font-size: 13px;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 22px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 22px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .stat-title {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
    }

    /* TOOLBAR */

    .toolbar {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: 1fr 180px 180px auto;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    /* TABLE */

    .table-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .table-header {
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
      font-weight: 800;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th,
    td {
      text-align: left;
      padding: 13px 15px;
      border-bottom: 1px solid #eef0f2;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
    }

    td {
      font-size: 14px;
    }

    .reference {
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
    }

    .target {
      max-width: 220px;
      word-break: break-word;
    }

    .status {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status-processing {
      background: #fef3c7;
      color: #92400e;
    }

    .status-promotion {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-completed {
      background: #dcfce7;
      color: #166534;
    }

    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-select {
      width: auto;
      min-width: 125px;
      padding: 8px;
      font-size: 12px;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: #6b7280;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #6b7280;
    }

    .message {
      position: fixed;
      right: 18px;
      bottom: 18px;
      max-width: 360px;
      padding: 13px 16px;
      border-radius: 10px;
      background: #111827;
      color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      z-index: 999;
    }

    .message.success {
      background: #166534;
    }

    .message.error {
      background: #991b1b;
    }

    /* MOBILE */

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      main {
        padding: 14px;
      }

      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .stat {
        padding: 15px;
      }

      .stat-value {
        font-size: 22px;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .login-card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- ======================================================
       LOGIN SCREEN
  ======================================================= -->

  <section id="loginScreen">

    <div class="login-card">

      <div class="logo">
        <h1>TokBoost GH</h1>
        <p>Secure Administrator Login</p>
      </div>

      <form id="loginForm">

        <div class="field">
          <label for="adminPassword">
            Administrator Password
          </label>

          <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Enter admin password"
          >
        </div>

        <button
          class="btn btn-primary"
          id="loginButton"
          type="submit"
        >
          Sign In
        </button>

      </form>

      <div
        id="loginError"
        class="error hidden"
      ></div>

    </div>

  </section>


  <!-- ======================================================
       ADMIN DASHBOARD
  ======================================================= -->

  <section
    id="dashboard"
    class="hidden"
  >

    <header>

      <div class="header-inner">

        <div class="header-title">
          <h1>TokBoost GH Admin</h1>
          <p>Order Management Dashboard</p>
        </div>

        <button
          id="logoutButton"
          class="btn btn-danger"
          type="button"
        >
          Logout
        </button>

      </div>

    </header>


    <main>

      <!-- STATS -->

      <section class="stats">

        <div class="stat">
          <div class="stat-title">
            Total Orders
          </div>

          <div
            class="stat-value"
            id="totalOrders"
          >
            0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            Processing
          </div>

          <div
            class="stat-value"
            id="processingOrders"
          >
            0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            Completed
          </div>

          <div
            class="stat-value"
            id="completedOrders"
          >
            0
          </div>
        </div>


        <div class="stat">
          <div class="stat-title">
            Cancelled
          </div>

          <div
            class="stat-value"
            id="cancelledOrders"
          >
            0
          </div>
        </div>

      </section>


      <!-- TOOLBAR -->

      <section class="toolbar">

        <input
          id="searchInput"
          type="search"
          placeholder="Search name, email, reference or TikTok..."
        >

        <select id="statusFilter">
          <option value="all">
            All statuses
          </option>

          <option value="processing">
            Processing
          </option>

          <option value="promotion">
            Promotion
          </option>

          <option value="completed">
            Completed
          </option>

          <option value="cancelled">
            Cancelled
          </option>
        </select>


        <select id="packageFilter">
          <option value="all">
            All packages
          </option>
        </select>


        <button
          id="refreshButton"
          class="btn btn-secondary"
          type="button"
        >
          Refresh
        </button>

      </section>


      <!-- ORDERS -->

      <section class="table-card">

        <div class="table-header">
          Customer Orders
        </div>

        <div
          id="loading"
          class="loading hidden"
        >
          Loading orders...
        </div>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>Date</th>
                <th>Customer</th>
                <th>Email</th>
                <th>Package</th>
                <th>Amount</th>
                <th>TikTok Target</th>
                <th>Reference</th>
                <th>Status</th>
              </tr>
            </thead>

            <tbody id="ordersBody"></tbody>

          </table>

        </div>

        <div
          id="emptyState"
          class="empty hidden"
        >
          No orders found.
        </div>

      </section>

    </main>

  </section>


  <div
    id="message"
    class="message hidden"
  ></div>


  <script>
    "use strict";

    /*
     * IMPORTANT
     *
     * This page never receives or stores:
     *
     * SUPABASE_SERVICE_ROLE_KEY
     * PAYSTACK_SECRET_KEY
     *
     * Authentication happens through:
     *
     * /api/admin-orders
     */

    const API_URL =
      "/api/admin-orders";


    const TOKEN_KEY =
      "tokboost_admin_token";


    let orders = [];


    /* ========================================================
       ELEMENTS
    ======================================================== */

    const loginScreen =
      document.getElementById(
        "loginScreen"
      );

    const dashboard =
      document.getElementById(
        "dashboard"
      );

    const loginForm =
      document.getElementById(
        "loginForm"
      );

    const adminPassword =
      document.getElementById(
        "adminPassword"
      );

    const loginButton =
      document.getElementById(
        "loginButton"
      );

    const loginError =
      document.getElementById(
        "loginError"
      );

    const logoutButton =
      document.getElementById(
        "logoutButton"
      );

    const refreshButton =
      document.getElementById(
        "refreshButton"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const statusFilter =
      document.getElementById(
        "statusFilter"
      );

    const packageFilter =
      document.getElementById(
        "packageFilter"
      );

    const ordersBody =
      document.getElementById(
        "ordersBody"
      );

    const emptyState =
      document.getElementById(
        "emptyState"
      );

    const loading =
      document.getElementById(
        "loading"
      );

    const message =
      document.getElementById(
        "message"
      );


    /* ========================================================
       MESSAGE
    ======================================================== */

    function showMessage(
      text,
      type = ""
    ) {

      message.textContent =
        text;

      message.className =
        "message";

      if (type) {
        message.classList.add(
          type
        );
      }

      setTimeout(() => {
        message.classList.add(
          "hidden"
        );
      }, 3500);
    }


    /* ========================================================
       LOGIN ERROR
    ======================================================== */

    function showLoginError(
      text
    ) {

      loginError.textContent =
        text;

      loginError.classList.remove(
        "hidden"
      );
    }


    function clearLoginError() {

      loginError.textContent =
        "";

      loginError.classList.add(
        "hidden"
      );
    }


    /* ========================================================
       TOKEN
    ======================================================== */

    function getToken() {

      return sessionStorage.getItem(
        TOKEN_KEY
      ) || "";
    }


    function saveToken(token) {

      sessionStorage.setItem(
        TOKEN_KEY,
        token
      );
    }


    function clearToken() {

      sessionStorage.removeItem(
        TOKEN_KEY
      );
    }


    /* ========================================================
       API REQUEST
    ======================================================== */

    async function apiRequest(
      url,
      options = {}
    ) {

      const token =
        getToken();

      const headers = {
        "Content-Type":
          "application/json",

        ...(options.headers || {})
      };


      if (token) {

        headers.Authorization =
          `Bearer ${token}`;
      }


      const response =
        await fetch(
          url,
          {
            ...options,
            headers
          }
        );


      let data = {};

      try {

        data =
          await response.json();

      } catch {

        data = {
          status: false,
          error:
            "Invalid server response."
        };
      }


      if (
        response.status === 401
      ) {

        clearToken();

        showLogin();

        throw new Error(
          data.error ||
          "Your administrator session has expired."
        );
      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Request failed."
        );
      }


      return data;
    }


    /* ========================================================
       LOGIN
    ======================================================== */

    async function login(
      password
    ) {

      loginButton.disabled =
        true;

      loginButton.textContent =
        "Signing in...";

      clearLoginError();


      try {

        const data =
          await apiRequest(
            API_URL,
            {
              method: "POST",

              body:
                JSON.stringify({
                  action: "login",
                  password: password
                })
            }
          );


        if (
          !data.status ||
          !data.token
        ) {

          throw new Error(
            "Login failed."
          );
        }


        saveToken(
          data.token
        );

        showDashboard();

        await loadOrders();


      } catch (error) {

        showLoginError(
          error.message ||
          "Invalid administrator credentials."
        );

      } finally {

        loginButton.disabled =
          false;

        loginButton.textContent =
          "Sign In";
      }
    }


    /* ========================================================
       SHOW LOGIN
    ======================================================== */

    function showLogin() {

      loginScreen.classList.remove(
        "hidden"
      );

      dashboard.classList.add(
        "hidden"
      );

      adminPassword.value =
        "";
    }


    /* ========================================================
       SHOW DASHBOARD
    ======================================================== */

    function showDashboard() {

      loginScreen.classList.add(
        "hidden"
      );

      dashboard.classList.remove(
        "hidden"
      );
    }


    /* ========================================================
       LOAD ORDERS
    ======================================================== */

    async function loadOrders() {

      loading.classList.remove(
        "hidden"
      );

      ordersBody.innerHTML =
        "";

      emptyState.classList.add(
        "hidden"
      );


      try {

        const data =
          await apiRequest(
            API_URL,
            {
              method: "GET"
            }
          );


        if (
          !data.status ||
          !Array.isArray(
            data.orders
          )
        ) {

          throw new Error(
            "Unable to load orders."
          );
        }


        orders =
          data.orders;


        updateStats();

        populatePackageFilter();

        renderOrders();


      } catch (error) {

        showMessage(
          error.message ||
          "Unable to load orders.",
          "error"
        );

      } finally {

        loading.classList.add(
          "hidden"
        );
      }
    }


    /* ========================================================
       UPDATE STATS
    ======================================================== */

    function updateStats() {

      const total =
        orders.length;


      const processing =
        orders.filter(
          order =>
            String(
              order.status || ""
            ).toLowerCase() ===
            "processing"
        ).length;


      const completed =
        orders.filter(
          order =>
            String(
              order.status || ""
            ).toLowerCase() ===
            "completed"
        ).length;


      const cancelled =
        orders.filter(
          order =>
            String(
              order.status || ""
            ).toLowerCase() ===
            "cancelled"
        ).length;


      document.getElementById(
        "totalOrders"
      ).textContent =
        total;


      document.getElementById(
        "processingOrders"
      ).textContent =
        processing;


      document.getElementById(
        "completedOrders"
      ).textContent =
        completed;


      document.getElementById(
        "cancelledOrders"
      ).textContent =
        cancelled;
    }


    /* ========================================================
       PACKAGE FILTER
    ======================================================== */

    function populatePackageFilter() {

      const current =
        packageFilter.value;


      const packages =
        [
          ...new Set(
            orders
              .map(
                order =>
                  String(
                    order.package_name ||
                    ""
                  ).trim()
              )
              .filter(Boolean)
          )
        ]
        .sort();


      packageFilter.innerHTML =
        `<option value="all">All packages</option>`;


      packages.forEach(
        packageName => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            packageName;

          option.textContent =
            packageName;

          packageFilter.appendChild(
            option
          );
        }
      );


      if (
        packages.includes(current)
      ) {

        packageFilter.value =
          current;
      }
    }


    /* ========================================================
       FILTER ORDERS
    ======================================================== */

    function getFilteredOrders() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();


      const selectedStatus =
        statusFilter.value;


      const selectedPackage =
        packageFilter.value;


      return orders.filter(
        order => {

          const searchable = [
            order.customer_name,
            order.email,
            order.reference,
            order.tiktok_target,
            order.package_name
          ]
            .map(
              value =>
                String(
                  value || ""
                ).toLowerCase()
            )
            .join(" ");


          const matchesSearch =
            !search ||
            searchable.includes(
              search
            );


          const orderStatus =
            String(
              order.status || ""
            ).toLowerCase();


          const matchesStatus =
            selectedStatus ===
              "all" ||
            orderStatus ===
              selectedStatus;


          const matchesPackage =
            selectedPackage ===
              "all" ||
            String(
              order.package_name ||
              ""
            ) ===
              selectedPackage;


          return (
            matchesSearch &&
            matchesStatus &&
            matchesPackage
          );
        }
      );
    }


    /* ========================================================
       ESCAPE HTML
    ======================================================== */

    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* ========================================================
       FORMAT DATE
    ======================================================== */

    function formatDate(
      value
    ) {

      if (!value) {
        return "—";
      }


      const date =
        new Date(value);


      if (
        Number.isNaN(
          date.getTime()
        )
      ) {

        return escapeHTML(
          value
        );
      }


      return date.toLocaleString();
    }


    /* ========================================================
       FORMAT AMOUNT
    ======================================================== */

    function formatAmount(
      value
    ) {

      const amount =
        Number(value);


      if (
        !Number.isFinite(
          amount
        )
      ) {

        return "GHS —";
      }


      return `GHS ${amount.toFixed(2)}`;
    }


    /* ========================================================
       STATUS CLASS
    ======================================================== */

    function statusClass(
      status
    ) {

      const clean =
        String(
          status || ""
        )
          .toLowerCase();


      if (
        [
          "processing",
          "promotion",
          "completed",
          "cancelled"
        ].includes(clean)
      ) {

        return `status-${clean}`;
      }


      return "status-processing";
    }


    /* ========================================================
       RENDER ORDERS
    ======================================================== */

    function renderOrders() {

      const filtered =
        getFilteredOrders();


      ordersBody.innerHTML =
        "";


      if (
        filtered.length === 0
      ) {

        emptyState.classList.remove(
          "hidden"
        );

        return;
      }


      emptyState.classList.add(
        "hidden"
      );


      filtered.forEach(
        order => {

          const row =
            document.createElement(
              "tr"
            );


          const status =
            String(
              order.status ||
              "processing"
            ).toLowerCase();


          row.innerHTML = `
            <td>
              ${escapeHTML(
                formatDate(
                  order.created_at
                )
              )}
            </td>

            <td>
              <strong>
                ${escapeHTML(
                  order.customer_name ||
                  "—"
                )}
              </strong>
            </td>

            <td>
              ${escapeHTML(
                order.email ||
                "—"
              )}
            </td>

            <td>
              ${escapeHTML(
                order.package_name ||
                "—"
              )}
            </td>

            <td>
              <strong>
                ${escapeHTML(
                  formatAmount(
                    order.amount
                  )
                )}
              </strong>
            </td>

            <td>
              <div class="target">
                ${escapeHTML(
                  order.tiktok_target ||
                  "—"
                )}
              </div>
            </td>

            <td>
              <div class="reference">
                ${escapeHTML(
                  order.reference ||
                  "—"
                )}
              </div>
            </td>

            <td>
              <select
                class="status-select"
                data-order-id="${escapeHTML(
                  order.id
                )}"
              >

                <option
                  value="processing"
                  ${
                    status ===
                    "processing"
                      ? "selected"
                      : ""
                  }
                >
                  Processing
                </option>

                <option
                  value="promotion"
                  ${
                    status ===
                    "promotion"
                      ? "selected"
                      : ""
                  }
                >
                  Promotion
                </option>

                <option
                  value="completed"
                  ${
                    status ===
                    "completed"
                      ? "selected"
                      : ""
                  }
                >
                  Completed
                </option>

                <option
                  value="cancelled"
                  ${
                    status ===
                    "cancelled"
                      ? "selected"
                      : ""
                  }
                >
                  Cancelled
                </option>

              </select>

              <div
                class="status ${statusClass(
                  status
                )}"
                style="margin-top:6px"
              >
                ${escapeHTML(
                  status
                )}
              </div>

            </td>
          `;


          ordersBody.appendChild(
            row
          );
        }
      );
    }


    /* ========================================================
       UPDATE ORDER STATUS
    ======================================================== */

    async function updateOrderStatus(
      orderId,
      newStatus,
      selectElement
    ) {

      if (!orderId) {

        showMessage(
          "Order ID is missing.",
          "error"
        );

        return;
      }


      const previousOrder =
        orders.find(
          order =>
            String(
              order.id
            ) ===
            String(
              orderId
            )
        );


      const previousStatus =
        previousOrder
          ? previousOrder.status
          : "processing";


      try {

        selectElement.disabled =
          true;


        const data =
          await apiRequest(
            API_URL,
            {
              method: "POST",

              body:
                JSON.stringify({
                  action:
                    "update_status",

                  orderId:
                    orderId,

                  status:
                    newStatus
                })
            }
          );


        if (
          !data.status
        ) {

          throw new Error(
            data.error ||
            "Unable to update order."
          );
        }


        if (previousOrder) {

          previousOrder.status =
            newStatus;
        }


        updateStats();

        renderOrders();


        showMessage(
          "Order status updated successfully.",
          "success"
        );


      } catch (error) {

        selectElement.value =
          previousStatus;


        showMessage(
          error.message ||
          "Unable to update order.",
          "error"
        );

      } finally {

        selectElement.disabled =
          false;
      }
    }


    /* ========================================================
       EVENT: LOGIN
    ======================================================== */

    loginForm.addEventListener(
      "submit",
      event => {

        event.preventDefault();

        const password =
          adminPassword.value;

        if (!password) {

          showLoginError(
            "Enter your administrator password."
          );

          return;
        }

        login(password);
      }
    );


    /* ========================================================
       EVENT: LOGOUT
    ======================================================== */

    logoutButton.addEventListener(
      "click",
      () => {

        clearToken();

        orders = [];

        showLogin();

        showMessage(
          "You have been logged out."
        );
      }
    );


    /* ========================================================
       EVENT: REFRESH
    ======================================================== */

    refreshButton.addEventListener(
      "click",
      () => {

        loadOrders();
      }
    );


    /* ========================================================
       EVENT: SEARCH
    ======================================================== */

    searchInput.addEventListener(
      "input",
      renderOrders
    );


    /* ========================================================
       EVENT: STATUS FILTER
    ======================================================== */

    statusFilter.addEventListener(
      "change",
      renderOrders
    );


    /* ========================================================
       EVENT: PACKAGE FILTER
    ======================================================== */

    packageFilter.addEventListener(
      "change",
      renderOrders
    );


    /* ========================================================
       EVENT: CHANGE ORDER STATUS
    ======================================================== */

    ordersBody.addEventListener(
      "change",
      event => {

        const select =
          event.target;


        if (
          !select.classList.contains(
            "status-select"
          )
        ) {

          return;
        }


        const orderId =
          select.dataset.orderId;


        const newStatus =
          select.value;


        updateOrderStatus(
          orderId,
          newStatus,
          select
        );
      }
    );


    /* ========================================================
       INITIAL SESSION CHECK
    ======================================================== */

    async function initialize() {

      const token =
        getToken();


      if (!token) {

        showLogin();

        return;
      }


      showDashboard();


      try {

        await loadOrders();

      } catch {

        clearToken();

        showLogin();
      }
    }


    initialize();

  </script>

</body>
</html>
